[package]
name = "hgpui_platform"
version = "0.1.0"
description.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"

[features]
default = ["font-kit"]
font-kit = ["hgpui_macos/font-kit"]
test-support = ["hgpui/test-support", "hgpui_macos/test-support"]
screen-capture = [
  "hgpui/screen-capture",
  "hgpui_macos/screen-capture",
  "hgpui_windows/screen-capture",
  "hgpui_linux/screen-capture",
]
runtime_shaders = ["hgpui_macos/runtime_shaders"]
wayland = ["hgpui_linux/wayland"]
x11 = ["hgpui_linux/x11"]
wgpu = ["hgpui_windows/wgpu"]

[dependencies]
hgpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
hgpui_macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
hgpui_windows.workspace = true
hgpui = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
hgpui_linux.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
hgpui_web.workspace = true
console_error_panic_hook.workspace = true
