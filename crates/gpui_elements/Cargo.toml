[package]
name = "hgpui_elements"
version = "0.1.0"
description.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["hgpui"]

[dependencies]
hgpui.workspace = true
unicode-segmentation.workspace = true
palette.workspace = true
smallvec.workspace = true

[dev-dependencies]
hgpui = { path = "../gpui", package = "hgpui", features = ["test-support"] }
hgpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[[example]]
name = "editable_text"
path = "examples/editable_text.rs"
