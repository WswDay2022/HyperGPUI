[package]
name = "hgpui_windows"
version = "0.1.0"
description.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_windows.rs"

[features]
default = ["hgpui/default"]
test-support = ["hgpui/test-support"]
screen-capture = ["hgpui/screen-capture", "scap"]
wgpu = ["dep:hgpui_wgpu"]

[dependencies]
hgpui.workspace = true
hgpui_wgpu = { workspace = true, optional = true, features = ["font-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit.workspace = true
accesskit_windows.workspace = true
anyhow.workspace = true
collections.workspace = true
dunce.workspace = true
etagere.workspace = true
futures.workspace = true
image.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
uuid.workspace = true
windows.workspace = true
windows-core.workspace = true
windows-numerics = "0.3.1"
windows-registry = "0.6.1"

[target.'cfg(target_os = "windows")'.dependencies.scap]
workspace = true
optional = true

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-registry = "0.6.1"
